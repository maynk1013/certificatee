apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-slack-example
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: default-null
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="critical"
          receiver: slack-optional
    receivers:
      - name: default-null
      - name: slack-optional
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            send_resolved: true
            channel: "#REPLACE_WITH_CHANNEL"
            title: "{{ .CommonLabels.alertname }}"
            text: "{{ .CommonAnnotations.summary }}"
