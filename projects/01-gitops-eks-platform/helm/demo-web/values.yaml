replicaCount: 2
image:
  repository: REPLACE_WITH_REGISTRY/demo-web
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
containerPort: 8080
appVersionEnv: "1.0.0"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
serviceAccount:
  create: true
  name: demo-web
nodeSelector: {}
tolerations: []
affinity: {}
serviceMonitor:
  enabled: false
  interval: 30s
