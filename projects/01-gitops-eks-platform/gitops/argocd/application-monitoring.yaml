apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 69.8.2
      helm:
        valueFiles:
          - $values/projects/01-gitops-eks-platform/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/maynk1013/certificatee.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # Automated sync is intentionally off for this monitoring chart.
  # Upgrade it only after reviewing the upstream chart changelog.
