grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GiB
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
alertmanager:
  config:
    route:
      receiver: "null"
      routes:
        - matchers:
            - severity="warning"
          receiver: slack-optional
    receivers:
      - name: "null"
      - name: slack-optional
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            send_resolved: true
            channel: "#REPLACE_WITH_CHANNEL"
