apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-active
spec:
  selector:
    app.kubernetes.io/name: demo-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-preview
spec:
  selector:
    app.kubernetes.io/name: demo-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
