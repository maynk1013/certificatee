apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    {{- if eq .Values.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ .Release.Name }}-active
      previewService: {{ .Release.Name }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
      prePromotionAnalysis:
        templates:
          - templateName: {{ .Release.Name }}-success-rate
    {{- else }}
    canary:
      stableService: {{ .Release.Name }}-active
      canaryService: {{ .Release.Name }}-preview
      steps:
        {{- range .Values.canary.weights }}
        - setWeight: {{ . }}
        - pause:
            duration: {{ $.Values.canary.pauseSeconds }}s
        - analysis:
            templates:
              - templateName: {{ $.Release.Name }}-success-rate
        {{- end }}
    {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: demo-web
          image: "{{ .Values.image.repository }}:{{ .Values.candidateVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_VERSION
              value: {{ .Values.candidateVersion | quote }}
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: FAIL_API
              value: {{ .Values.simulateFailure | quote }}
            - name: FAIL_READY
              value: {{ .Values.simulateFailure | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
