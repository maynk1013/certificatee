apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Release.Name }}-success-rate
spec:
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= {{ subf 1 .Values.canary.errorThreshold }}
      failureLimit: {{ .Values.canary.failureLimit }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress | quote }}
          query: |
            sum(rate(demo_http_requests_total{status!~"5..",namespace="{{ .Release.Namespace }}"}[2m]))
            /
            clamp_min(sum(rate(demo_http_requests_total{namespace="{{ .Release.Namespace }}"}[2m])), 0.001)
