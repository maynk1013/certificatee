# Copy this file to .github/workflows/ci.yml to activate it.
# The publishing token used for the first push could not create that path.

name: portfolio-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python tools/secret_scan.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Format and validate
        run: |
          set -eu
          terraform fmt -check -recursive projects
          for dir in \
            projects/01-gitops-eks-platform/terraform/envs/dev \
            projects/03-terraform-multi-environment/envs/dev \
            projects/03-terraform-multi-environment/envs/staging \
            projects/03-terraform-multi-environment/envs/prod \
            projects/06-disaster-recovery/terraform \
            projects/07-secrets-management/terraform
          do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
          terraform -chdir=projects/03-terraform-multi-environment/tests/fixtures/invalid-syntax init -backend=false -input=false
          if terraform -chdir=projects/03-terraform-multi-environment/tests/fixtures/invalid-syntax validate; then
            echo "invalid fixture was accepted"
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"
      - run: helm lint projects/01-gitops-eks-platform/helm/demo-web
      - run: helm lint projects/02-progressive-delivery/helm/demo-rollout

  image-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q projects/01-gitops-eks-platform/app/tests/test_image_policy.py
      - name: Trivy is not executed in this job
        run: echo "Image vulnerability scanning needs a built image and Trivy. This job only checks the Dockerfile policy."
